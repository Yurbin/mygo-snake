name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test(无窗口逻辑与视图测试)
        run: go test ./...

      - name: 交叉构建 linux/amd64 冒烟(纯 Go 无 cgo)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/mygo-snake .
          scripts/check-elf.sh /tmp/mygo-snake

      - uses: actions/upload-artifact@v4
        with:
          name: mygo-snake-linux-amd64-smoke
          path: /tmp/mygo-snake
          retention-days: 7

  # 麒麟 V10 SP1 同基座(ubuntu:20.04:GTK 3.24 / glibc 2.31)真机冒烟:
  # 容器里装 GTK3 运行库 + Xvfb 虚拟显示,实际启动产物,
  # 覆盖「mygo 在老 GTK 上的符号兼容」「无 GL 时 CPU 渲染回退」「用户级菜单集成」三个风险点。
  # 用 docker run 而非 container:(ubuntu:20.04 无 node,JS actions 跑不起来)。
  kylin-smoke:
    name: 麒麟基座冒烟(ubuntu:20.04 容器 + Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 构建 linux/amd64 二进制
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o mygo-snake .

      - name: 容器内冒烟
        run: |
          docker run --rm -v "$PWD":/src ubuntu:20.04 bash -euxc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              libgtk-3-0 libglib2.0-0 xvfb file >/dev/null

            xvfb-run -a bash -euxc "
              # 1) 依赖自检脚本应全部通过(与麒麟 V10 SP1 同版 GTK 3.24)
              /src/scripts/check-deps.sh

              # 2) 应用应存活满 8 秒直到被 timeout 终止(exit 124)
              set +e
              timeout 8 /src/mygo-snake > /tmp/out.log 2>&1
              code=\$?
              set -e
              cat /tmp/out.log
              if grep -qi \"panic\\|fatal error\" /tmp/out.log; then
                echo \"[错误] 运行日志含 panic/fatal\"; exit 1
              fi
              [ \$code -eq 124 ] || { echo \"[错误] 应用未存活满 8 秒,exit=\$code\"; exit 1; }

              # 3) 用户级开始菜单集成应已写入(零 root)
              test -f \$HOME/.local/share/applications/mygo-snake.desktop
              grep -q \"StartupWMClass=mygo-snake\" \$HOME/.local/share/applications/mygo-snake.desktop
              test -f \$HOME/.local/share/icons/hicolor/1024x1024/apps/mygo-snake.png

              # 4) --uninstall 应清除上述文件
              /src/mygo-snake --uninstall
              test ! -e \$HOME/.local/share/applications/mygo-snake.desktop
              echo \"[OK] 麒麟同基座(ubuntu:20.04)冒烟全部通过\"
            "
          '
